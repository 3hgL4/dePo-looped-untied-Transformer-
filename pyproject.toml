[project]
name = "insidetheloop"
version = "1.0.0"
description = "Training, probing and analysis code for 'Inside the Loop' (NeurIPS 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Magnus Sesodia" },
    { name = "Juil Sock" },
    { name = "Philip Torr" },
    { name = "Christian Schroeder de Witt" },
]
dependencies = [
    # The version the paper's runs used. Newer releases reject the model's attention call
    # (padding mask together with is_causal=True).
    "torch==2.5.1",
    "numpy>=1.24",
    "tqdm>=4.60",
    "transformers>=4.36,<5.0",
    "matplotlib==3.10.8",  # the version that rendered the paper figures
]

[project.urls]
Repository = "https://github.com/magnus-sesodia/insidetheloop"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# CUDA 12.1 PyTorch wheels on Linux (driver 530 and newer). On another CUDA version, change the
# index URL; on macOS the default PyPI wheel is used.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
