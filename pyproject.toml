[project]
name = "looped_lm"
version = "0.1.0"
description = "Looped transformers: training, probing, and figure code for Inside the Loop (anonymous)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Anonymous" }]
dependencies = [
    "torch>=2.5.1",
    "numpy>=1.24",
    "tqdm>=4.60",
    "transformers>=4.36,<5.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tensorboard>=2.14",
    "scipy>=1.10",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/looped_lm"]

# Optional CUDA 12.1 PyTorch wheels for Linux. Comment out the
# [[tool.uv.index]] and [tool.uv.sources] blocks if you want pip to
# resolve torch normally (e.g. on macOS / CPU-only / a different CUDA).
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
